name: Groundskeeper
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  tidy:
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - appengine
          - gcloud
          - io_file
          - jot
          - native_synchronization
          - timezone
          - unix_api
    uses: dart-lang/ecosystem/.github/workflows/groundskeeper.yml@16dca7ae5d3ff896a4db47e1ed6cd50f7ebbf115
    with:
      directory: pkgs/${{ matrix.package }}
      branch: auto-tidy-${{ matrix.package }}
      title: 'Tidy: package:${{ matrix.package }}'
      update-changelog: true
      changelog-message: 'Automated formatting and fixes.'
    secrets: inherit # zizmor: ignore[secrets-inherit]
