# A CI configuration to publish package:native_synchronization to pub.dev.

name: Publish package:native_synchronization

on:
  push:
    tags:
      - 'native_synchronization-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@f452aa90bb3c3726734faa9a86685617572bfeb0
    with:
      working-directory: pkgs/native_synchronization
