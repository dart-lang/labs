name: package:jot

permissions: read-all

on:
  # Run CI on pushes to the main branch, and on PRs against main.
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/jot.yml'
      - 'pkgs/jot/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/jot.yml'
      - 'pkgs/jot/**'
  schedule:
    - cron: '0 0 * * 0' # weekly

defaults:
  run:
    working-directory: pkgs/jot

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}

      - run: dart pub get

      - run: dart analyze --fatal-infos

      - run: dart format --output=none --set-exit-if-changed .
        if: ${{ matrix.sdk == 'dev' }}

      # Ensure that the front-end is up to date.
      - run: dart tool/build_web.dart --verify

      # Ensure that we can build the front-end.
      - run: dart tool/build_web.dart

      - run: dart test

      # Ensure that we can build the Dart SDK docs.
      - run: dart tool/create_dart_sdk.dart
