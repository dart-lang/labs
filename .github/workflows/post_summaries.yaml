# A CI configuration to post comments to PRs.
#
# This workflow will have permissions to create comments on the PR even if the
# original workflow couldn't.

name: Comment on the pull request
permissions:
  contents: read

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@78abf72b3cfcc7c6c822032d8915153019fe79b7 # main
    permissions:
      pull-requests: write
