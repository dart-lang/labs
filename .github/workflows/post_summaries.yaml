# A CI configuration to post comments to PRs.
#
# This workflow will have permissions to create comments on the PR even if the
# original workflow couldn't.

name: Comment on the pull request
permissions:
  contents: read

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: 
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@65c6a1f8bb7d62369f8e164cbb3bd6383e944811
    permissions:
      pull-requests: write
