# A CI configuration to post comments to PRs.
#
# This workflow will have permissions to create comments on the PR even if the
# original workflow couldn't.

name: Comment on the pull request
permissions:
  contents: read

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: 
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@467f1e9b190d72f75b906112979fa21483ac43b9
    permissions:
      pull-requests: write
