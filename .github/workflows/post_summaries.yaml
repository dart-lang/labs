# A CI configuration to post comments to PRs.
#
# This workflow will have permissions to create comments on the PR even if the
# original workflow couldn't.

name: Comment on the pull request
permissions:
  contents: read

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: 
      - Publish
      - Health
    types:
      - completed

jobs:
  upload:
    uses: dart-lang/ecosystem/.github/workflows/post_summaries.yaml@fc3dd9a17a8e18b3b4aa5abac8a0f4a679fe2d57
    permissions:
      pull-requests: write
