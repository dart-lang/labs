name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@65c6a1f8bb7d62369f8e164cbb3bd6383e944811
    with:
      ignore_coverage: "**.mock.dart,**.g.dart"
      ignore_license: "**.mock.dart,**.g.dart,**.mocks.dart"
    permissions:
      pull-requests: write
